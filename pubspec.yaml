name: cheesera
description: A clean, tactile, minimalist film simulation & camera roll photo editor mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Image processing & manipulation
  image: ^4.2.0
  
  # Photo picking from camera, files and gallery
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  
  # Sensors for shake-to-develop darkroom agitation
  sensors_plus: ^6.1.0
  
  # Media saving & exporting
  gal: ^2.3.1
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  http: ^1.2.0
  
  # UI, icons & tactile feedback
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/luts/
