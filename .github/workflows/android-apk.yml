name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, beta ]
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: |
          flutter create --platforms=android --org com.cheesera .
          # Remove duplicate kts files created by modern flutter create to prevent conflicts with .gradle
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheesera-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
