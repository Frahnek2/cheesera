name: Build AltStore IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure iOS project exists
        run: flutter create --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

           - name: Build unsigned iOS app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --config-only
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/xc \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package Runner.app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/xc/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry app-altstore.ipa Payload

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: altstore-ipa
          path: app-altstore.ipa
