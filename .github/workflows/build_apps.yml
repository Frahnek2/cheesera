name: Build Cheesera (.apk & .ipa)

on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main, beta ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheesera-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build iOS App (No Codesign for Direct Package)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned .ipa Archive
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r cheesera.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheesera-ios-ipa
          path: build/ios/ipa/cheesera.ipa
          if-no-files-found: error
